<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halo 4: Forward Unto Dawn</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Pantalla inicial para activar el audio con una pulsación */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
    }
    .play-btn {
      padding: 16px 28px;
      border: 1px solid #38bdf8;
      border-radius: 50px;
      background: rgba(56, 189, 248, 0.1);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      transition: transform 0.2s ease;
    }
    .play-btn:active {
      transform: scale(0.95);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: none; /* Se oculta hasta hacer clic */
    }
  </style>
</head>
<body>

  <!-- Botón de inicio sobre pantalla negra -->
  <div id="overlay" class="overlay" onclick="iniciarVideo()">
    <div class="play-btn">▶ Toca para ver con sonido</div>
  </div>

  <!-- Contenedor del video -->
  <iframe 
    id="videoPlayer"
    src="" 
    allow="autoplay; fullscreen" 
    allowfullscreen>
  </iframe>

  <script>
    function iniciarVideo() {
      var overlay = document.getElementById('overlay');
      var iframe = document.getElementById('videoPlayer');
      
      // Oculta la pantalla de inicio y muestra el reproductor
      overlay.style.display = 'none';
      iframe.style.display = 'block';
      
      // Asigna la URL con autoplay habilitado tras el toque del usuario
      iframe.src = "https://archive.org/embed/Halo.-4.-Adelante.-Hasta.-el.amanecer.-2012.1080p.-blu-ray.x-264.-aac-5.1-yts.-mx?autoplay=1";
    }
  </script>

</body>
</html>
