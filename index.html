
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tarjeta Digital</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 380px;
      padding: 32px 24px;
      border-radius: 24px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
    }
    p.bio {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.4;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #334155;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease-in-out;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn:hover, .btn:active {
      transform: translateY(-2px);
      background-color: #38bdf8;
      color: #0f172a;
      box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Pon la URL de tu imagen o logo entre las comillas de src -->
    <img class="avatar" src="https://via.placeholder.com/150" alt="Foto de perfil">
    
    <!-- Nombre principal -->
    <h1>Tu Nombre o Usuario</h1>
    
    <!-- Descripción corta -->
    <p class="bio">Creador de contenido • Diseñador • Proyectos 3D</p>

    <!-- Botones de Redes Sociales (Cambia las URLs dentro de href="") -->
    <div class="links">
      <a href="https://instagram.com/TU_USUARIO" class="btn" target="_blank">
        📸 Instagram
      </a>
      
      <a href="https://twitch.tv/TU_USUARIO" class="btn" target="_blank">
        👾 Twitch
      </a>
      
      <a href="https://youtube.com/@TU_CANAL" class="btn" target="_blank">
        ▶️ YouTube
      </a>
      
      <a href="https://tiktok.com/@TU_USUARIO" class="btn" target="_blank">
        🎵 TikTok
      </a>

      <a href="https://wa.me/5210000000000" class="btn" target="_blank">
        💬 WhatsApp Directo
      </a>
    </div>
  </div>

</body>
</html>
