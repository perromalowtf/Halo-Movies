<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000000; /* Fondo totalmente negro */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    video {
      width: 100%;
      max-width: 800px;
      max-height: 100vh;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Reemplaza URL_DE_TU_VIDEO.mp4 por la dirección real de tu archivo de video -->
  <video controls autoplay playsinline muted>
    <source src="URL_DE_TU_VIDEO.mp4" type="video/mp4">
    Tu navegador no soporta la reproducción de video.
  </video>

</body>
</html>
